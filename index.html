<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lord Vesper's Table</title>
  <link rel="stylesheet" href="src/style.css">
</head>
<body>
  <main id="parlor">
    <header>
      <p class="eyebrow">Castle Vesper · The Crimson Parlor</p>
      <h1>Lord Vesper's Table</h1>
      <button id="mute" type="button">Let the room speak</button>
    </header>
    <div id="manor" data-candles="3">
      <div id="door" aria-hidden="true"></div>
      <p id="room"></p>
      <p id="story"></p>
      <div id="felt">
        <div id="far">
          <div id="candles" aria-hidden="true"></div>
          <figure id="lord">
            <div id="lord-frame" data-portrait="set">
              <img id="lord-portrait" src="assets/lord.png" alt="">
            </div>
            <figcaption class="visually-hidden">Lord Vesper</figcaption>
          </figure>
          <p id="message" role="status"></p>
          <p id="remark"></p>
          <section id="dealer-rail" aria-label="Lord Vesper">
            <h2 class="visually-hidden">Lord Vesper</h2>
            <div id="dealer-cards" class="cards"></div>
            <p id="dealer-value"></p>
          </section>
        </div>
        <div id="stake" aria-hidden="true"></div>
        <div id="near">
          <section id="player-rail" aria-label="You">
            <h2 class="visually-hidden">You</h2>
            <div id="player-hands"></div>
          </section>
          <div id="betting">
            <button id="bet-down" type="button">Lower stake</button>
            <button id="bet-up" type="button">Raise stake</button>
            <button id="deal" type="button">Deal</button>
            <button id="withdraw" type="button">Leave the table</button>
          </div>
          <div id="actions">
            <button id="hit" type="button">Hit</button>
            <button id="stand" type="button">Stand</button>
            <button id="double" type="button">Double</button>
            <button id="split" type="button">Split</button>
          </div>
          <div id="between">
            <button id="continue" type="button">Next hand</button>
            <button id="new-evening" type="button">Another evening</button>
          </div>
        </div>
      </div>
      <div id="cup">
        <div id="vial" aria-label="Blood remaining"></div>
        <p id="blood"></p>
        <p id="pending-bet"></p>
      </div>
    </div>
    <p id="ledger"></p>
  </main>
  <script type="module" src="src/ui.js"></script>
</body>
</html>
